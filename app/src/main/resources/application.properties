spring.application.name=stop-factor
server.port=9090

spring.datasource.url=jdbc:postgresql://localhost:5432/stopfactor_db
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Omitted numeric fields in requests default to 0
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Swagger UI: http://localhost:9090/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Loads lazy collections (stop factor products) in batches instead of one query per stop factor
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Validation and error messages in Russian regardless of the client's Accept-Language
spring.web.locale=ru_RU
spring.web.locale-resolver=fixed

# LOCAL ONLY: test endpoint for StopFactorService.check with imitated KIB / OB data (/api/v1/admin/test/stop-factor-check).
# Must stay false (or absent) in SPR
stop-factor.test-check.enabled=true
